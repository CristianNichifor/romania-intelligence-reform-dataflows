<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S-a mutat — Fluxuri de date pentru reforma serviciilor de informații</title>
    <link rel="canonical" href="https://projects.cristian-nichifor.com/romania-intelligence-reform-dataflows/" />
    <meta name="robots" content="noindex" />
    <!--
      GitHub Pages serves this file as index.html and as 404.html, so every old link lands
      here. The script keeps the path under the project prefix, the query and the hash, so a
      deep link opens the same view on the new host. The meta refresh is the no-JavaScript
      fallback and can only reach the base page.
    -->
    <script>
      (function () {
        var base = 'https://projects.cristian-nichifor.com/romania-intelligence-reform-dataflows/';
        var prefix = '/romania-intelligence-reform-dataflows/';
        var path = location.pathname;
        var rest = path.indexOf(prefix) === 0 ? path.slice(prefix.length) : '';
        location.replace(base + rest + location.search + location.hash);
      })();
    </script>
    <noscript>
      <meta
        http-equiv="refresh"
        content="0; url=https://projects.cristian-nichifor.com/romania-intelligence-reform-dataflows/"
      />
    </noscript>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0b0d10;
        color: #e8eaed;
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f7f8fa;
          color: #14181d;
        }
      }
      a {
        color: #7fb3ff;
      }
      @media (prefers-color-scheme: light) {
        a {
          color: #1a5fd0;
        }
      }
      p {
        max-width: 32rem;
      }
    </style>
  </head>
