name: Deploy the redirect

# The app is built and served by deploy-pages-cloudflare.yml, on
# projects.cristian-nichifor.com/romania-intelligence-reform-dataflows/. GitHub Pages publishes
# only redirect/: index.html and 404.html (served for every unknown path) send each old
# cristiannichifor.github.io link to the same path, query and hash on the new host.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A redirect that points at nothing turns a working link into a 404, so the stub cannot
      # go live before the site it forwards to.
      - name: Check the destination is live
        run: |
          url=https://projects.cristian-nichifor.com/romania-intelligence-reform-dataflows/
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
          echo "$url -> $code"
          [ "$code" = "200" ] || { echo "destination is not serving; refusing to publish the redirect"; exit 1; }

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
